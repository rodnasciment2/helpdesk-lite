<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelpDesk Lite</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div class="brand">H<span>HelpDesk <b>Lite</b></span></div><span class="tag">Central de suporte</span></header><main><section class="intro"><p class="eyebrow">ORGANIZE. ATENDA. RESOLVA.</p><h1>Seu suporte, em ordem.</h1><p>Acompanhe os chamados de TI em um só lugar.</p></section><div class="layout"><section class="panel"><h2 id="form-title">Novo chamado</h2><p class="muted">Descreva o problema para iniciar o atendimento.</p><form id="ticket-form"><label>Título<input name="titulo" required minlength="3" maxlength="120" placeholder="Ex.: Impressora não imprime"></label><label>Descrição<textarea name="descricao" required minlength="5" maxlength="2000" rows="4" placeholder="O que aconteceu? Quais testes foram feitos?"></textarea></label><div class="pair"><label>Categoria<select name="categoria"><option>Rede</option><option>Hardware</option><option>Software</option><option>Impressora</option><option>Acesso</option><option>Outros</option></select></label><label>Prioridade<select name="prioridade"><option>Baixa</option><option selected>Média</option><option>Alta</option><option>Crítica</option></select></label></div><label>Status<select name="status"><option>Aberto</option><option>Em atendimento</option><option>Resolvido</option></select></label><button id="submit">Criar chamado</button><button id="cancel" type="button" class="secondary" hidden>Cancelar edição</button></form></section><section class="workspace"><div class="list-heading"><h2>Chamados</h2><span id="count" class="tag">0 chamados</span></div><form id="filters" class="filters"><input name="busca" maxlength="120" aria-label="Buscar por título" placeholder="Buscar por título…"><select name="status" aria-label="Filtrar por status"><option value="">Todos os status</option><option>Aberto</option><option>Em atendimento</option><option>Resolvido</option></select><button>Buscar</button></form><p id="message" role="status" aria-live="polite"></p><div id="tickets"></div></section></div><footer>HelpDesk Lite · JavaScript, Node.js, PostgreSQL e Docker</footer></main></body></html>
